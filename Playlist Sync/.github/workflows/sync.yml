name: Production Playlist Sync

on:
  schedule:
    # Runs every 15 minutes outside work hours (adjust as needed)
    - cron: '*/15 8 * * *'
    - cron: '*/15 18-0 * * *'
  workflow_dispatch: # Allows you to manually trigger a run anytime from the GitHub website

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests rapidfuzz

      - name: Run sync script
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          APPLE_MUSIC_WEBHOOK_TOKEN: ${{ secrets.APPLE_MUSIC_WEBHOOK_TOKEN }}
        run: python main.py
